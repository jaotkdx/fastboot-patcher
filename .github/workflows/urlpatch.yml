name: Patch Image via URL

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Recovery Image URL'
        default: 'https://transfer.sh/<file-id>/<file>.img'
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
    - name: Gain file access
      uses: actions/checkout@v4.1.1
    
    - name: Fetch necessary packages
      run: |
         sudo apt install git wget lz4 tar openssl python3 -y
         
    - name: Download recovery image from URL
      run: |
         wget "${{ github.event.inputs.image_url }}" -O recovery.img

    - name: Start patching script
      run: |
         # 1. Força o curl a falhar de verdade (-f) se a URL não existir, pulando para a próxima válida
         curl -fLo magiskboot https://github.com/bmaxv/magiskboot-linux/raw/main/magiskboot || curl -fLo magiskboot https://github.com/shocke3/magiskboot-linux/raw/master/magiskboot
         chmod a+x magiskboot
         chmod a+x patcher-minimal

         # 2. DIAGNÓSTICO: Verifica se o seu link do transfer.sh baixou uma imagem real ou um HTML de erro
         echo "=== Analisando o arquivo baixado ==="
         file recovery.img || true
         head -n 2 recovery.img | cut -c 1-100 || true
         echo "===================================="

         # 3. CORREÇÃO DE SEGURANÇA: Se a imagem não tiver a tag SEANDROIDENFORCE, 
         # fazemos o script usar o tamanho total do arquivo em vez de quebrar o 'dd'
         sed -i 's/count=$off/count=${off:-$(stat -c%s raw.img)}/g' patcher-minimal

         # 4. Roda o script com acompanhamento detalhado
         bash -x ./patcher-minimal
        
    - name: Upload keys for patched image
      uses: actions/upload-artifact@v4
      with:
        path: keys/
        name: Patched Image Key Bundle
        if-no-files-found: error
        retention-days: 15
        compression-level: 0
        overwrite: true
