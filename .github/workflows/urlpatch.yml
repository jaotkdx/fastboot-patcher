name: Patch Image via URL

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Recovery Image URL'
        default: 'https://transfer.sh/<file-id>/<file>.img'
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
    - name: Gain file access
      uses: actions/checkout@v4.1.1
    
    - name: Fetch necessary packages
      run: |
         sudo apt install git wget lz4 tar openssl python3 -y
         
    - name: Download recovery image from URL
      run: |
         wget "${{ github.event.inputs.image_url }}" -O recovery.img

    - name: Start patching script
      run: |
         # Baixa uma versão do magiskboot atualizada por desenvolvedores ativos da comunidade TWRP/Magisk
         curl -Lo magiskboot https://github.com/wstxda/magiskboot-linux/raw/master/magiskboot || curl -Lo magiskboot https://github.com/bmaxv/magiskboot-linux/raw/main/magiskboot
         chmod a+x magiskboot
         chmod a+x patcher-minimal
         
         # TESTE DE MESA: Força o unpack antes do script para expor o erro real no log do GitHub caso falhe
         echo "=== testando capacidade do magiskboot ==="
         ./magiskboot unpack recovery.img || echo "Aviso: Falha direta no desempacotamento"
         echo "========================================="
         
         # Roda o script em modo detalhado (-x) para expor todas as variáveis internas no log
         bash -x ./patcher-minimal

    - name: Upload patched image files
      uses: actions/upload-artifact@v4
      with:
        path: output/
        name: Patched Recovery Image Bundle
        if-no-files-found: error
        retention-days: 15
        compression-level: 0
        overwrite: true
        
    - name: Upload keys for patched image
      uses: actions/upload-artifact@v4
      with:
        path: keys/
        name: Patched Image Key Bundle
        if-no-files-found: error
        retention-days: 15
        compression-level: 0
        overwrite: true
